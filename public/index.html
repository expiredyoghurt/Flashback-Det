<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Flashback Detectives</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap two"><main class="card" id="main"></main><aside class="card" id="side"></aside></div>
<script>
let T=null,U='',C=null,ME={completions:[],badges:{},writings:[]},run,story=[],pts=0,node,sid,t0,P={};
try{T=localStorage.getItem('tok');U=localStorage.getItem('usr')||'';P=JSON.parse(localStorage.getItem('prefs')||'{}')}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;'),paras=a=>a.map(x=>{const o=typeof x==='string'?{t:x}:x,b=o.t.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('');return o.fb?`<div class="flash"><b>💭 Flashback</b>${b}</div>`:b}).join('');
function prefs(k){if(k){P[k]=!P[k];try{localStorage.setItem('prefs',JSON.stringify(P))}catch(e){}}document.body.classList.toggle('dys',!!P.dys);document.body.classList.toggle('big',!!P.big)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&T&&!/login|register/.test(p)){logout();throw new Error('Please log in again')}if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function logout(){T=null;try{localStorage.removeItem('tok')}catch(e){}login()}
const tools=()=>`<div class="tools"><button class="alt" onclick="prefs('dys');side()">Aa Easy-read font</button><button class="alt" onclick="prefs('big');side()">🔎 Bigger text</button></div>`;
const BN={first:'First Steps',explorer:'Path Explorer',placer:'Strategic Placer',content:'Content Master',length:'Length Expert',architect:'Flashback Architect',persist:'Persistent Learner'};
function xpHTML(){if(ME.xp==null||!ME.rank)return'';const r=ME.rank,pct=r.next?Math.min(100,Math.round(100*(ME.xp-r.min)/(r.next-r.min))):100;return `<div class="rank">${r.ic} <b>${esc(r.n)}</b> · ${ME.xp} XP</div><div class="xpbar"><i style="width:${pct}%"></i></div><small>${r.next?(r.next-ME.xp)+' XP to '+esc(r.nextName):'Top rank!'}</small>`}
function meterHTML(){if(!C||!C.skills)return'';const S=ME.skills||{};return `<h2>🧭 My skills</h2>${Object.keys(C.skills).map(k=>{const s=S[k],m=C.skills[k],v=s&&s[0]>=3?Math.round(100*s[1]/s[0]):null;return `<div class="sk"><span>${m.ic} ${esc(m.n)}</span><div class="xpbar"><i style="width:${v==null?0:v}%"></i></div><small>${v==null?'new':v+'%'}</small></div>`}).join('')}`}
function recHTML(){const n=ME.next;if(!n||!C.skills[n.skill])return'';if(n.task)return `<div class="fbk o">🎯 <b>Try next:</b> ${n.task==='choose'?'the Picture Prompt Challenge':'Fix the Flashback'} to practise <b>${esc(C.skills[n.skill].n)}</b></div>`;const s=C.stories.find(x=>x.id===n.story);return s?`<div class="fbk o">🎯 <b>Try next:</b> ${esc(s.title)} to practise <b>${esc(C.skills[n.skill].n)}</b></div>`:''}
let xpGain=0;
function side(){if(!T){$('side').innerHTML=`<h2>📘 Notes</h2><p><a href="notes.html" target="_blank">What are the 3 kinds of flashback?</a></p><p><a href="teacher.html">Teacher login</a></p>${tools()}`;return}
const n=ME.completions.length,b=ME.badges||{};
$('side').innerHTML=`<h2>🔍 ${esc(U)}</h2><div class="bar"><span class="pill">⭐ ${ME.completions.reduce((a,c)=>a+c.points,0)} pts</span><span class="pill">📚 ${n}/${C?C.stories.length:10}</span></div>${xpHTML()}<h2>🏅 Badges</h2>${Object.keys(BN).map(k=>`<span class="badge ${b[k]?'':'locked'}">${b[k]?'🏅':'🔒'} ${BN[k]}</span>`).join('')}
${meterHTML()}${(ME.writings||[]).filter(w=>w.comment).slice(0,3).map(w=>`<h2>💬 Teacher note</h2><p><i>${esc(w.comment)}</i></p>`).join('')}<p><a href="notes.html" target="_blank">📘 Notes on the 3 flashbacks</a></p>${tools()}<button class="alt" onclick="logout()">Log out</button>`}
function login(msg){side();$('main').innerHTML=`<div style="font-size:2.4rem">🔍📖</div><h1>Flashback Detectives</h1><p>Log in to practise writing flashbacks.</p><label>Your username<input id="u" value="${esc(U)}" autocomplete="username"></label><label>PIN (4–8 numbers)<input id="p" type="password" inputmode="numeric" autocomplete="current-password"></label><label>Class (new pupils only)<input id="c" placeholder="e.g. 4A"></label><p class="err" id="e">${msg||''}</p><button class="go" onclick="auth('login')">Log in</button><button class="alt" onclick="auth('register')">I'm new: create my account</button>`}
async function auth(k){try{const d=await api(k,{username:$('u').value,pin:$('p').value,class:$('c').value});T=d.token;U=d.username;try{localStorage.setItem('tok',T);localStorage.setItem('usr',U)}catch(e){}menu()}catch(e){$('e').textContent=e.message}}
function mapHTML(t){return `<div class="map">${C.types[t].map.map(s=>`<div class="${s[2]?'m':''}" style="flex:${s[1]}">${s[0]}</div>`).join('')}</div>`}
async function menu(){try{speechSynthesis.cancel()}catch(e){}try{[C,ME]=await Promise.all([api('stories'),api('me')])}catch(e){return T?($('main').innerHTML='<p class="err">'+esc(e.message)+'</p>'):0}side();
const as=new Set(C.assigned),L=C.stories.slice().sort((a,b)=>(as.has(b.id)-as.has(a.id)));const done={};ME.completions.forEach(c=>done[c.story]=c);
$('main').innerHTML=`<h1>Pick a flashback story</h1><p>Each story teaches one kind of flashback. <a href="notes.html" target="_blank">📘 Read the notes first</a></p>${recHTML()}
<div class="cards"><div class="sc"><div class="i">🧩</div><h2>Which flashback is it?</h2><p>Read short extracts and sort them.${ME.sort&&ME.sort.t?' Best: '+ME.sort.s+'/'+ME.sort.t:''}</p><button class="c1" onclick="sortGame()">Play ▶</button></div>
<div class="sc"><div class="i">🖼️</div><h2>Picture Prompt Challenge</h2><p>Read a picture and plot idea. Which flashback fits, and what is the best plan?</p><button class="c2" onclick="chooseList()">Play ▶</button></div><div class="sc"><div class="i">🔧</div><h2>Fix the Flashback</h2><p>Spot what is wrong in a flawed flashback, then rewrite that part.</p><button class="c3" onclick="repairList()">Play ▶</button></div>
${L.map(s=>{const c=done[s.id];return `<div class="sc"><div class="i">${s.ic}</div><h2>${C.types[s.type].kind}</h2><b>${esc(s.title)}</b> ${c?(c.perfect?'⭐':'✅'):''} ${as.has(s.id)?'<span class="pill">📌 Assigned</span>':''}${ME.next&&ME.next.story===s.id?'<span class="pill">🎯 Recommended</span>':''}<p>${esc(s.blurb)}</p><button class="go" onclick="begin('${s.id}')">${c?'Play again':'Start'} ▶</button></div>`}).join('')}</div>`}
async function begin(id){try{const d=await api('run/start',{story:id});sid=id;run=d.run;story=[];pts=0;xpGain=0;show(d.node)}catch(e){alert(e.message)}}
function show(n){node=n;const S=C.stories.find(s=>s.id===sid),ord=n.o.map((_,i)=>i).sort(()=>Math.random()-.5);
$('main').innerHTML=`<h1>${S.ic} ${esc(S.title)} <small>· ${C.types[S.type].kind}</small></h1>${mapHTML(S.type)}<div class="bar"><span class="pill">⭐ ${pts} pts</span>${xpGain?`<span class="pill">✨ +${xpGain} XP</span>`:''}</div><div class="story" id="st">${story.length?paras(story):'<p><i>Your story will appear here...</i></p>'}</div>
<h2>${esc(n.q)} <button class="alt sm" onclick="say(node.q+'. '+node.o.map(o=>o.l).join('. '))">🔊</button></h2><div id="ch">${ord.map((k,j)=>{const o=n.o[k];return `<button class="c${j}" onclick="pick(${k})">${'ABCD'[j]}. ${esc(o.l)}</button>${o.t?`<details><summary>👀 Show example</summary>${esc(o.t)}</details>`:''}`}).join('')}</div>
<details><summary>💡 Need a hint?</summary>${esc(n.h)}</details><div id="fb"></div><div class="tools"><button class="alt" onclick="say(story.map(x=>x.t||x).join(' '))">🔊 Read my story</button><button class="alt" onclick="menu()">⬅ Back to stories</button></div>`;
$('st').scrollTop=1e5;t0=Date.now()}
async function pick(k){document.querySelectorAll('#ch button').forEach(b=>b.disabled=true);
try{const d=await api('run/choice',{run,idx:k,ms:Date.now()-t0}),lab={g:'✅ Great choice!',o:'⚠️ Almost there',b:'❌ Let’s rethink'};
$('fb').innerHTML=`<div class="fbk ${d.r}"><b>${lab[d.r]}</b> ${d.p?'<b>+'+d.p+' pts</b>':''} ${d.half?'<small>(half points: you tried again)</small>':''}<p>${esc(d.f)}</p><p>💡 <b>Tip:</b> ${esc(d.tip)}</p><button class="alt sm" onclick="say(${JSON.stringify(d.f+' '+d.tip).replace(/"/g,'&quot;')})">🔊</button></div>${d.retry?'':'<button class="go" id="k">Continue ▶</button>'}<button class="alt" id="a">↩ Try a different choice</button>`;
$('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
$('a').onclick=async()=>{try{show(d.retry?node:(await api('run/retry',{run})).node)}catch(e){alert(e.message)}};
if(!d.retry)$('k').onclick=async()=>{try{const r=await api('run/advance',{run});story=r.story;pts=r.pts;xpGain=r.xp||0;r.done?summary(r):show(r.node)}catch(e){alert(e.message)}}}catch(e){$('fb').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function summary(r){const S=C.stories.find(s=>s.id===sid),T_=C.types[S.type];CT=T_;
$('main').innerHTML=`<h1>🎉 Story complete!</h1>${mapHTML(S.type)}<div class="story" style="max-height:none">${paras(story)}</div><p><b>Points: ${pts}</b> ${r.perfect?'⭐ Perfect run!':''}</p>
<h2>✍️ Your turn</h2><p>${esc(S.wp)}</p>${T_.frame.map(f=>`<div class="rq"><b>${esc(f.l)}</b><br><small>${esc(f.h)}</small><textarea class="wp" rows="3" oninput="wcount()"></textarea></div>`).join('')}<small><span id="wc">0</span> words</small><button class="alt" onclick="quick()">🔍 Quick check my writing</button><div id="qc"></div>
<h2>🧠 Reflection</h2>${T_.rq.map((q,i)=>{const f=(T_.scaf||[])[i]||{s:[],i:[]};return `<div class="rq"><p>${i+1}. ${esc(q)}</p><textarea class="rf" rows="3" oninput="nudge(${i})"></textarea><div class="nudge" id="n${i}"></div><small>✏️ Sentence starters (tap one):</small><div>${f.s.map(s=>`<button type="button" class="chip" onclick="addS(${i},this)">${esc(s)}</button>`).join('')}</div><details><summary>💡 Ideas you could write about</summary><ul>${f.i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></div>`}).join('')}<p class="err" id="e"></p><button class="go" onclick="finish()">Save my work ▶</button>`}
let CT=null;const AIR={};
async function askAI(rule){const b=$('ai_'+rule),m=$('aim_'+rule);b.disabled=true;m.textContent=' 🤖 thinking…';try{const d=await api('run/ai-check',{run,rule,parts:[...document.querySelectorAll('.wp')].map(t=>t.value)});
if(d.outcome==='met'){AIR[rule]=d.reason;await quick()}else m.innerHTML=' <small>'+(d.outcome==='not_met'?'🤖 The AI helper also thinks it is missing: '+esc(d.reason):'🤖 The AI helpers could not agree, so your teacher may take a look.')+'</small>'}catch(e){m.textContent=' '+e.message;b.disabled=false}}
function wcount(){$('wc').textContent=[...document.querySelectorAll('.wp')].reduce((n,t)=>n+t.value.trim().split(/\s+/).filter(Boolean).length,0)}
async function quick(){try{const d=await api('run/check',{run,parts:[...document.querySelectorAll('.wp')].map(t=>t.value)});$('qc').innerHTML=`<h3>Quick check: ${d.passed}/${d.total}</h3><p><small>This is a guide, not a grade. Edit your writing and check again as often as you like.</small></p>`+d.results.filter(x=>!x.na).map(x=>`<div class="fbk ${x.ok?'g':'o'}">${x.ok?(x.ai?'🤖✅':'✅'):'⚠️'} ${esc(x.label)}${x.ai?' <small>(the AI helper agreed'+(AIR[x.id]?': '+esc(AIR[x.id]):'')+')</small>':''}${x.ok?'':'<br><small>'+esc(x.hint)+'</small>'}${x.can_ask?`<br><button class="alt sm" id="ai_${x.id}" onclick="askAI('${x.id}')">🤔 I think I did this: ask the AI helper</button><span id="aim_${x.id}"></span>`:''}</div>`).join('')+(d.ai&&d.ai.on?`<p><small>🤖 The AI helper only reads the part of your writing it needs. Never write your real name or private details. AI checks left today: ${d.ai.left}.</small></p>`:'')}catch(e){$('qc').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function nudge(i){const v=document.querySelectorAll('.rf')[i].value.trim(),n=$('n'+i),k=(CT.nudge||[])[i],w=v.split(/\s+/).filter(Boolean).length;let m='';
if(w&&w<6)m='Try a full sentence of at least 6 words.';
else if(w>=6){if(k==='because'&&!/\b(because|since|so that|therefore|so)\b/i.test(v))m='Can you add a reason? Try “because…”.';
else if(k==='compare'&&!/\b(but|whereas|while|however|different|unlike|instead|than|both)\b/i.test(v))m='Compare the two kinds. Try “but” or “whereas”.';
else if(k==='action'&&!/\b(should|must|need|remember|next time|always|never|will|try)\b/i.test(v))m='What will you do next time? Try “Next time I will…”.'}
n.textContent=m?'💬 '+m:(w>=6?'👍 Good detail!':'')}
function addS(i,b){const t=document.querySelectorAll('.rf')[i],v=t.value;t.value=(v&&!/\s$/.test(v)?v+'\n':v)+b.textContent+' ';t.focus()}
async function finish(){try{const pr=ME.rank&&ME.rank.n;const r=await api('run/finish',{run,parts:[...document.querySelectorAll('.wp')].map(t=>t.value),reflection:[...document.querySelectorAll('.rf')].map(t=>t.value)});await menu();const up=ME.rank&&pr&&ME.rank.n!==pr?`<br>🎉 Rank up: ${ME.rank.ic} ${esc(ME.rank.n)}!`:'';$('main').insertAdjacentHTML('afterbegin',`<div class="cert">🏆 <b>Flashback Detective Certificate</b><br>${esc(U)} finished <b>${esc(C.stories.find(s=>s.id===sid).title)}</b> with ${r.points} points!<br>✨ +${r.xp} XP${up}</div>`)}catch(e){$('e').textContent=e.message}}
let TRD=null;
async function chooseList(){TRD=await api('transfer');$('main').innerHTML=`<h1>🖼️ Picture Prompt Challenge</h1><p>Pick a picture. Decide which kind of flashback the plot needs, then choose the best plan.</p><div class="cards">${TRD.choose.map(x=>`<div class="sc"><div class="i">${x.ic}</div><b>${esc(x.title)}</b> ${x.done?'✅':''}<p><small>${esc(x.see)}</small></p><button class="go" onclick="chooseView('${x.id}')">Open ▶</button></div>`).join('')}</div><button class="alt" onclick="menu()">⬅ Back to stories</button>`}
function chooseView(id){const x=TRD.choose.find(y=>y.id===id),o=x.plan.map((_,i)=>i).sort(()=>Math.random()-.5);
$('main').innerHTML=`<h1>${esc(x.title)}</h1><div class="pic">${x.ic}</div><p><i>${esc(x.see)}</i></p><p><b>Plot idea:</b> ${esc(x.plot)}</p><h2>1. Which kind of flashback fits this plot best?</h2>${Object.entries(C.types).map(([k,v])=>`<label class="chk"><input type="radio" name="ct" value="${k}"><span>${v.kind}</span></label>`).join('')}<h2>2. Which plan is best?</h2>${o.map(i=>`<label class="chk"><input type="radio" name="cp" value="${i}"><span>${esc(x.plan[i])}</span></label>`).join('')}<div id="cr"></div><button class="go" id="cb" onclick="chooseSubmit('${id}')">Check my answers ▶</button><button class="alt" onclick="chooseList()">⬅ Back to pictures</button>`}
async function chooseSubmit(id){const t=document.querySelector('input[name=ct]:checked'),p=document.querySelector('input[name=cp]:checked');if(!t||!p)return alert('Please answer both questions');
try{const r=await api('transfer/choose',{id,type:t.value,plan:+p.value});$('cb').disabled=true;$('cr').innerHTML=`<div class="fbk ${r.type_ok?'g':'b'}">${r.type_ok?'✅ Right type!':'❌ It needed a '+esc(C.types[r.correct].kind)+'.'} ${esc(r.why)}</div><div class="fbk ${r.plan_ok?'g':'b'}">${r.plan_ok?'✅ Good plan!':'❌ '+esc(r.plan_f)}${r.plan_ok?'':'<br><b>Best plan:</b> '+esc(r.best)}</div>${r.xp?`<p>✨ +${r.xp} XP</p>`:''}`}catch(e){alert(e.message)}}
async function repairList(){TRD=await api('transfer');$('main').innerHTML=`<h1>🔧 Fix the Flashback</h1><p>Each flashback has one part with a problem. Find it, then fix it.</p><div class="cards">${TRD.repair.map(x=>`<div class="sc"><b>${esc(x.title)}</b> ${x.done?'✅':''}<p><small>${esc(C.types[x.type].kind)}</small></p><button class="go" onclick="repairView('${x.id}')">Open ▶</button></div>`).join('')}</div><button class="alt" onclick="menu()">⬅ Back to stories</button>`}
let RP=null;
async function repairView(id){const d=await api('transfer/repair?id='+id);RP=d;const o=d.diag.map(x=>x.i).sort(()=>Math.random()-.5);
$('main').innerHTML=`<h1>🔧 ${esc(d.title)}</h1><p>This is meant to be a <b>${esc(d.kind)}</b>. One part has a problem.</p>${d.parts.map((t,i)=>`<div class="rq ${i===d.edit?'fixme':''}"><b>${esc(d.frame[i].l)}${i===d.edit?' 🔧':''}</b><div>${esc(t)}</div></div>`).join('')}<h2>1. What is the main problem?</h2>${o.map(i=>`<label class="chk"><input type="radio" name="dg" value="${i}"><span>${esc(d.diag[i].t)}</span></label>`).join('')}<button class="alt" onclick="diagSubmit()">Check</button><div id="dg"></div>
<h2>2. Fix the “${esc(d.frame[d.edit].l)}” box</h2><p>Your fix must: ${d.targets.map(esc).join(' · ')}</p><textarea id="fx" rows="5">${esc(d.parts[d.edit])}</textarea><button class="go" onclick="fixSubmit()">Check my fix ▶</button><div id="fr"></div><button class="alt" onclick="repairList()">⬅ Back to the list</button>`}
async function diagSubmit(){const c=document.querySelector('input[name=dg]:checked');if(!c)return alert('Choose one first');try{const r=await api('transfer/diagnose',{id:RP.id,choice:+c.value});$('dg').innerHTML=`<div class="fbk ${r.ok?'g':'o'}">${r.ok?'✅':'⚠️'} ${esc(r.f)}${r.ok?'':'<br><b>The main problem:</b> '+esc(r.best)}</div>`}catch(e){alert(e.message)}}
async function fixSubmit(){try{const r=await api('transfer/fix',{id:RP.id,text:$('fx').value});$('fr').innerHTML=(r.changed?'':'<div class="fbk o">⚠️ Change the text to fix the problem.</div>')+r.results.map(x=>`<div class="fbk ${x.ok?'g':'o'}">${x.ok?'✅':'⚠️'} ${esc(x.label)}${x.ok?'':'<br><small>'+esc(x.hint)+'</small>'}</div>`).join('')+(r.pass?`<div class="fbk g">🎉 Fixed! ${r.xp?'✨ +'+r.xp+' XP':''}</div>`:`<p><small>Attempt ${r.attempt}. Edit and check again.</small></p>`)+(r.model?`<details open><summary>Model fix</summary>${esc(r.model)}</details>`:'')}catch(e){$('fr').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function sortGame(){const d=await api('sort');const K=Object.entries(C.types);
$('main').innerHTML=`<h1>🧩 Which flashback is it?</h1><p>Read each extract. Pick the kind of flashback. (<a href="notes.html" target="_blank">notes</a>)</p>${d.items.map(it=>`<div class="story" style="max-height:none"><p>${it.i+1}. ${esc(it.x)}</p><select class="sa">${'<option value="">Choose…</option>'+K.map(([k,v])=>`<option value="${k}">${v.kind}</option>`).join('')}</select><div class="ex" id="x${it.i}"></div></div>`).join('')}<button class="go" id="sb" onclick="sortSubmit()">Check my answers ▶</button><button class="alt" onclick="menu()">⬅ Back to stories</button>`}
async function sortSubmit(){const a=[...document.querySelectorAll('.sa')].map(s=>s.value);if(a.includes(''))return alert('Please answer every extract');const r=await api('sort',{answers:a});$('sb').disabled=true;
r.results.forEach((x,i)=>$('x'+i).innerHTML=`<div class="fbk ${x.ok?'g':'b'}">${x.ok?'✅ Correct!':'❌ It was '+C.types[x.a].kind+'.'} ${esc(x.e)}</div>`);$('sb').insertAdjacentHTML('beforebegin',`<h2>Score: ${r.score}/${r.total}${r.xp?` · ✨ +${r.xp} XP`:''}</h2>`)}
prefs();T?menu():login();
</script></body></html>
