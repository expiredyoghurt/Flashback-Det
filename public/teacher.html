<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Teacher Dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="card" id="m"></div><div id="d" style="display:grid;gap:14px"></div></div><div id="sheet" aria-hidden="true"></div>
<script>
let T=null,S=null,F='',ROLE='',WHO='',TL=[],R=false,CC=null,OPEN=0,CP=[],PV=null,MSG='';const N=c=>(c||'').trim().toUpperCase();const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function api(p,b,method){const r=await fetch('/api/admin/'+p,{method:method||(b?'POST':'GET'),headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&T&&p!=='login'){T=null;login('Please log in again');throw new Error('Please log in again')}if(!r.ok)throw new Error(d.error||'Error');return d}
function login(m){$('d').innerHTML='';$('m').innerHTML=`<h1>🍎 Teacher Login</h1><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><p class="err" id="e">${m||''}</p><button class="go" onclick="go()">Log in</button><a href="/">← Pupil page</a>`}
async function go(){try{const d=await api('login',{user:$('u').value,password:$('p').value});T=d.token;ROLE=d.role;WHO=d.name;load()}catch(e){$('e').textContent=e.message}}
const title=id=>(S.stories.find(s=>s.id===id)||{title:id}).title,kind=id=>{const s=S.stories.find(x=>x.id===id);return s?S.types[s.type].kind:''};
async function load(){try{S=await api('summary');TL=ROLE==='admin'?(await api('teachers')).teachers:[];CC=await api('classes');CP=OPEN&&CC.classes.some(c=>c.id===OPEN)?(await api('classes/'+OPEN+'/pupils')).pupils:[];if(!CC.classes.some(c=>c.id===OPEN)){OPEN=0;PV=null}}catch(e){return login(e.message)}draw()}
function csv(){const rows=[['name','username','class','stories_done','points','try_agains','last_active','xp','rank','flags']].concat(S.pupils.map(p=>[p.name,p.username,p.class,p.done,p.points,p.tries,p.last_active||'',p.xp,p.rank,p.flags.join('; ')]),[[],['username','class','story','points','perfect','date']],S.completions.map(c=>[c.username,c.class,title(c.story),c.points,c.perfect?'yes':'no',c.ts]));
const t=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='flashback-detectives.csv';a.click()}
function draw(){const cls=S.classes,inC=x=>!F||(F==='none'?x.class_id==null:String(x.class_id)===F);
const P=S.pupils.filter(inC),ids=new Set(P.map(p=>p.id)),ok=x=>!F||ids.has(x.pupil_id);
$('m').innerHTML=`<h1>🍎 Teacher Dashboard</h1><div class="tabs"><select id="cf" style="width:auto" onchange="F=this.value;draw()"><option value="">All classes</option>${cls.map(c=>`<option ${String(c.id)===F?'selected':''} value="${c.id}">${esc(c.name)}${c.archived?' (archived)':''}</option>`).join('')}${S.guests?`<option ${F==='none'?'selected':''} value="none">Guests (no class)</option>`:''}</select><button class="alt sm" onclick="load()">Refresh</button><button class="alt sm" onclick="csv()">⬇ CSV</button><button class="alt sm" onclick="T=null;login()">Log out</button></div><p><b>${esc(WHO)}</b> (${ROLE==='admin'?'super admin':'teacher'}) · ${P.length} pupils · ${S.completions.filter(ok).length} completed stories</p>${ROLE==='teacher'&&!S.classes.length?'<p class="err">You have no classes yet. Create one in the Classes section at the bottom'+(CC&&!CC.canCreate?', or ask the super admin to give you yours':'')+'.</p>':''}`;
const g={};S.choices.forEach(c=>{const k=c.story+'|'+c.node;const x=g[k]=g[k]||{story:c.story,node:c.node,tot:0,bad:0,secs:0,rows:[]};x.tot+=c.n;if(c.r!=='g')x.bad+=c.n;x.secs=Math.max(x.secs,c.secs||0);x.rows.push(c)});
const asg=new Set(S.assignments.map(a=>a.class_id+'|'+a.story));
$('d').innerHTML=`${heat(P)}<div class="card"><h2>Pupils</h2><label class="chk"><input type="checkbox" ${R?'checked':''} onchange="R=this.checked;draw()"><span>Show only pupils with flags (${P.filter(p=>p.flags.length).length})</span></label><table><tr><th>Pupil</th><th>Class</th><th>Stories</th><th>Points</th><th>Try-agains</th><th>XP / rank</th><th>⚠️ Flags</th><th>Last active</th></tr>${P.filter(p=>!R||p.flags.length).map(p=>`<tr><td><a href="#" onclick="drill(${p.id});return false">${esc(p.name)}</a><br><small>${esc(p.username)}</small></td><td>${esc(p.class)||'<small>guest</small>'}</td><td>${p.done}/${S.stories.length}</td><td>${p.points}</td><td>${p.tries}</td><td>${p.xp} · ${esc(p.rank)}</td><td>${p.flags.length?p.flags.map(f=>'⚠️ '+esc(f)).join('<br>'):'<small>✓</small>'}</td><td>${esc(p.last_active||'-')}</td></tr>`).join('')}</table><div id="dr"></div></div>
<div class="card"><h2>Where pupils struggle (all classes)</h2><table><tr><th>Story</th><th>Step</th><th>Picks</th><th>% not best</th><th>Most picked</th><th>Slowest (s)</th></tr>${Object.values(g).sort((a,b)=>b.bad/b.tot-a.bad/a.tot).slice(0,25).map(x=>{const t=x.rows.sort((a,b)=>b.n-a.n)[0];return `<tr><td>${esc(title(x.story))}</td><td>${esc(x.node)}</td><td>${x.tot}</td><td>${Math.round(100*x.bad/x.tot)}%</td><td>${esc(t.choice)} (${t.n})</td><td>${x.secs}</td></tr>`}).join('')}</table></div>
<div class="card"><h2>Pupil writing (add a comment)</h2>${S.writings.filter(ok).map(w=>`<details><summary><b>${esc(w.username)}</b> · ${esc(title(w.story))} · ${esc(w.ts)} ${w.comment?'💬':''}</summary><p style="white-space:pre-wrap">${esc(w.text)}</p><p><small>${qc(w.checks)}</small></p><textarea id="cm${w.id}" rows="2" placeholder="Comment for the pupil">${esc(w.comment)}</textarea><button class="go sm" onclick="cmt(${w.id})">Save comment</button></details>`).join('')||'<p>No writing yet.</p>'}</div>
${aiCards()}${tcard()}${gaps(S.writings.filter(ok))}<div class="card"><h2>Reflections</h2>${S.completions.filter(ok).map(c=>{let r=[];try{r=JSON.parse(c.reflection)}catch(e){}return `<details><summary><b>${esc(c.username)}</b> · ${esc(title(c.story))} · ${c.points} pts ${c.perfect?'⭐':''}</summary>${r.map((a,i)=>`<p>${i+1}. ${esc(a)||'<i>blank</i>'}</p>`).join('')}</details>`}).join('')||'<p>Nothing yet.</p>'}</div>
<div class="card"><h2>Assign stories to a class</h2>${F&&F!=='none'?`<p>Class <b>${esc((cls.find(c=>String(c.id)===F)||{}).name)}</b> (assigned stories are pinned for these pupils)</p>${S.stories.map(s=>`<label class="chk"><input type="checkbox" ${asg.has(F+'|'+s.id)?'checked':''} onchange="asn('${s.id}',this.checked)"><span>${esc(s.title)} <small>(${esc(S.types[s.type].kind)})</small></span></label>`).join('')}`:'<p>Choose a class in the filter above.</p>'}</div>
${ROLE==='admin'?`<div class="card"><h2>👩‍🏫 Teacher accounts</h2><table><tr><th>Username</th><th>Classes they can manage</th><th></th></tr>${TL.map(x=>`<tr><td>${esc(x.username)}</td><td><details><summary>${x.classIds.length} class${x.classIds.length===1?'':'es'}</summary>${S.classes.map(c=>`<label class="chk"><input type="checkbox" data-t="${esc(x.username)}" value="${c.id}" ${x.classIds.includes(c.id)?'checked':''}><span>${esc(c.name)}${c.archived?' (archived)':''}</span></label>`).join('')||'<small>No classes yet.</small>'}<button class="go sm" onclick="tcls('${esc(x.username)}')">Save classes</button></details></td><td><button class="alt sm" onclick="tpw('${esc(x.username)}')">Reset password</button> <button class="alt sm" onclick="tdel('${esc(x.username)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="3">No teacher accounts yet.</td></tr>'}</table><p><small>Teachers only see the classes you tick. ${CC&&CC.teacherCreate?'They can also create classes of their own (switch that off in the Classes section).':'Teachers can’t create classes (switched off in the Classes section).'}</small></p><h3>Create a teacher</h3><input id="tn" placeholder="username"><input id="tp" type="password" placeholder="password (8+ characters)" autocomplete="new-password"><button class="go" onclick="tnew()">Create teacher account</button></div>`:`<div class="card"><h2>🔑 Change my password</h2><input id="op" type="password" placeholder="current password"><input id="np" type="password" placeholder="new password (8+ characters)" autocomplete="new-password"><button class="go" onclick="cpw()">Change password</button></div>`}
<div class="card" id="cc">${classCard()}</div>`}
async function drill(id){try{const d=await api('pupil?id='+id),pp=S.pupils.find(x=>x.id===id);$('dr').innerHTML=`<h2>${esc(pp.name)} <small>(${esc(pp.username)})</small></h2>${meters(pp)}<p>Sorting game: ${d.sorts.map(s=>s.score+'/'+s.total).join(', ')||'not played'}</p><table><tr><th>Story</th><th>Pts</th><th>Date</th></tr>${d.completions.map(c=>`<tr><td>${esc(title(c.story))}</td><td>${c.points} ${c.perfect?'⭐':''}</td><td>${esc(c.ts)}</td></tr>`).join('')}</table><details><summary>Last ${d.picks.length} choices</summary><table>${d.picks.map(p=>`<tr><td>${esc(title(p.story))}</td><td>${esc(p.node)}</td><td>${esc(p.choice)}</td><td>${p.r==='g'?'✅':p.r==='o'?'⚠️':'❌'}</td><td>${p.tries?'retry':''}</td></tr>`).join('')}</table></details>`}catch(e){$('dr').textContent=e.message}}
const done=async(f,m)=>{try{const r=await f();MSG=m||'';await load();return r}catch(e){alert(e.message)}};
const cmt=id=>done(()=>api('comment',{id,comment:$('cm'+id).value}));
const asn=(story,on)=>done(()=>api('assign',{class_id:+F,story,on}));
/* ---------- classes and pupils (v2.0): the same tools as Dialogue Dungeon ---------- */
let PVT='';
const ccNew=async()=>{try{const r=await api('classes',{name:$('cn').value});OPEN=r.class.id;PV=null;PVT='';MSG='Class created. Add its pupils below.';await load()}catch(e){alert(e.message)}};
const ccOpen=id=>{OPEN=OPEN===id?0:id;PV=null;PVT='';MSG='';load()};
const ccRename=id=>done(()=>api('classes/'+id,{name:$('crn').value},'PATCH'),'Class renamed');
const ccArchive=(id,a)=>done(()=>api('classes/'+id,{archived:!!a},'PATCH'),a?'Class archived: everyone is signed out and nobody can log in until you restore it.':'Class restored.');
const ccSetting=v=>done(()=>api('class-settings',{teacherCreate:v}),v?'Teachers can create classes.':'Only you can create classes now.');
async function ccRegen(id){if(!confirm('Make a new class code? The old code will stop working.'))return;const out=confirm('Also sign everyone in this class out right now?\n\nOK = sign everyone out\nCancel = let people who are already logged in carry on');try{const r=await api('classes/'+id+'/regen',{signOut:out});MSG='New class code: '+r.code+(r.signedOut?' (everyone was signed out).':'.');await load()}catch(e){alert(e.message)}}
function ccDelete(id){const c=CC.classes.find(x=>x.id===id);const n=prompt('This deletes the class, its '+c.pupils+' pupils AND all their results for good.\n\nType the class name ('+c.name+') to confirm:');if(n!==null&&n.trim()===c.name)done(()=>api('classes/'+id,null,'DELETE'),'Class deleted.');else if(n!==null)alert('That is not the class name, so nothing was deleted.')}
async function pvCheck(id){PVT=$('pvt').value;try{PV=(await api('classes/'+id+'/pupils/preview',{text:PVT})).rows;if(!PV.length)alert('Nothing to add: type one pupil per line.');draw()}catch(e){alert(e.message)}}
async function pvAdd(id){try{const r=await api('classes/'+id+'/pupils',{pupils:PV.map((x,i)=>({name:x.name,username:$('pvu'+i).value}))});MSG='Added '+r.added+' pupil'+(r.added===1?'':'s')+(r.skipped.length?'. Skipped: '+r.skipped.map(s=>s.name+' ('+s.reason+')').join('; '):'.');PV=null;PVT='';await load()}catch(e){alert(e.message)}}
const pupSave=id=>done(()=>api('pupils/'+id,{name:$('pn'+id).value,username:$('pu'+id).value,class_id:+$('pc'+id).value},'PATCH'),'Pupil saved.');
const pupReset=id=>{const p=CP.find(x=>x.id===id);if(confirm('Clear all of '+p.name+'’s results (stories, writing, XP)? Their account stays.'))done(()=>api('pupils/'+id+'/reset',{}),'Progress cleared.')};
const pupDel=id=>{const p=CP.find(x=>x.id===id);if(confirm('Delete '+p.name+' and all their results for good?'))done(()=>api('pupils/'+id,null,'DELETE'),'Pupil deleted.')};
function classCard(){if(!CC)return '';const cl=CC.classes,open=cl.find(c=>c.id===OPEN);
return `<h2>🏫 Classes</h2><p><small>Pupils log in with their <b>username and the class code</b>. There are no passwords or PINs. Give the code only to that class.</small></p><p id="cmsg" role="status">${esc(MSG)}</p>${CC.canCreate?`<div class="row2"><input id="cn" placeholder="New class name, e.g. 4A" maxlength="60" aria-label="New class name"><button class="go sm" onclick="ccNew()">Create class</button></div>`:'<p><small>Only the super admin can create classes.</small></p>'}
<table><tr><th>Class</th><th>Code</th><th>Pupils</th><th>Status</th><th></th></tr>${cl.map(c=>`<tr><td>${esc(c.name)}</td><td><b class="code">${esc(c.code)}</b></td><td>${c.pupils}</td><td>${c.archived?'archived':'active'}</td><td><button class="alt sm" onclick="ccOpen(${c.id})">${c.id===OPEN?'Close':'Open'}</button></td></tr>`).join('')||'<tr><td colspan="5">No classes yet.</td></tr>'}</table>
${CC.guests!=null?`<p><small>Guest players: ${CC.guests}. Their work is deleted after 30 days and only you can see it.</small></p>`:''}${ROLE==='admin'?`<label class="chk"><input type="checkbox" ${CC.teacherCreate?'checked':''} onchange="ccSetting(this.checked)"><span>Teachers can create their own classes</span></label>`:''}${open?classDetail(open):''}`}
function classDetail(c){return `<hr><h3>${esc(c.name)}: class code <b class="code">${esc(c.code)}</b></h3>
<div class="row2"><input id="crn" value="${esc(c.name)}" maxlength="60" aria-label="Class name"><button class="alt sm" onclick="ccRename(${c.id})">Rename</button><button class="alt sm" onclick="ccArchive(${c.id},${c.archived?0:1})">${c.archived?'Restore class':'Archive class'}</button><button class="alt sm" onclick="ccRegen(${c.id})">New class code…</button><button class="alt sm" onclick="printCards(${c.id})">🖨 Print login cards</button><button class="alt sm" onclick="ccDelete(${c.id})">Delete class…</button></div>
<p><small>Archiving signs the whole class out and blocks log-in until you restore it. A new code stops the old one working; you can sign everyone out at the same time.</small></p>
<h4>Add pupils</h4><textarea id="pvt" rows="5" placeholder="One pupil per line: Name, or Name, username" aria-label="Pupils to add">${esc(PVT)}</textarea><button class="go sm" onclick="pvCheck(${c.id})">Check the list</button>${PV?pvTable(c):''}
<h4>Pupils in ${esc(c.name)} (${CP.length})</h4>${pupTable(c)}`}
function pvTable(c){return `<table><tr><th>Name</th><th>Username</th><th>Check</th></tr>${PV.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><input id="pvu${i}" value="${esc(r.username)}" maxlength="24" aria-label="Username for ${esc(r.name)}"></td><td>${r.status==='ok'?'✔ new pupil':r.status==='duplicate'?'⚠ already used in this class: change it':'✖ use 2–24 letters, numbers, . _ -'}</td></tr>`).join('')}</table><button class="go" onclick="pvAdd(${c.id})">Add ${PV.length} pupil${PV.length===1?'':'s'}</button>`}
function pupTable(c){return CP.length?`<div style="overflow-x:auto"><table><tr><th>Name</th><th>Username</th><th>Class</th><th>Stories</th><th>Answers</th><th>XP</th><th></th></tr>${CP.map(p=>`<tr><td><input id="pn${p.id}" value="${esc(p.name)}" maxlength="60" aria-label="Name"></td><td><input id="pu${p.id}" value="${esc(p.username)}" maxlength="24" aria-label="Username"></td><td><select id="pc${p.id}" aria-label="Class">${CC.classes.filter(x=>!x.archived||x.id===c.id).map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td>${p.stories}</td><td>${p.answers}</td><td>${p.xp}</td><td><button class="go sm" onclick="pupSave(${p.id})">Save</button> <button class="alt sm" onclick="pupReset(${p.id})">Reset progress</button> <button class="alt sm" onclick="pupDel(${p.id})">Delete</button></td></tr>`).join('')}</table></div>`:'<p>No pupils yet. Paste a list above.</p>'}
function printCards(id){const c=CC.classes.find(x=>x.id===id);if(!c||!CP.length)return alert('Add some pupils first.');$('sheet').innerHTML=`<div class="sheet">${CP.map(p=>`<div class="sc"><b>🔍 Flashback Detectives</b><br>Go to <b>${esc(location.host)}</b><br>Class code: <span class="big">${esc(c.code)}</span><br>Username: <span class="big">${esc(p.username)}</span><br><small>${esc(p.name)} · ${esc(c.name)}</small></div>`).join('')}</div><p class="note">Cut along the dashed lines. Give each pupil their own card; the class code is only for this class.</p>`;document.body.classList.add('printing');window.print();setTimeout(()=>{document.body.classList.remove('printing');$('sheet').innerHTML=''},400)}
function tcard(){const X=S.transfer,pc=(a,n)=>n?Math.round(100*a/n)+'%':'-',K=k=>(S.types[k]||{kind:k}).kind;
const ch=S.transferTasks.choose.map(x=>{const r=X.choose.find(y=>y.task===x.id)||{n:0,a:0,b:0},w=X.wrong.filter(y=>y.task===x.id).sort((a,b)=>b.n-a.n)[0];return `<tr><td>${esc(x.title)}<br><small>${esc(K(x.type))}</small></td><td>${r.n}</td><td>${pc(r.a,r.n)}</td><td>${pc(r.b,r.n)}</td><td>${w?'Picked '+esc(K(w.wrong))+' ('+w.n+')':'-'}</td></tr>`}).join('');
const rp=S.transferTasks.repair.map(x=>{const d=X.diag.find(y=>y.task===x.id)||{n:0,a:0},f=X.fix.find(y=>y.task===x.id)||{pupils:0,passed:0,attempts:0};return `<tr><td>${esc(x.title)}<br><small>${esc(K(x.type))}</small></td><td>${pc(d.a,d.n)}</td><td>${f.pupils}</td><td>${pc(f.passed,f.pupils)}</td><td>${f.pupils?(f.attempts/f.pupils).toFixed(1):'-'}</td></tr>`}).join('');
return `<div class="card"><h2>🧪 Transfer tasks</h2><p><small>Picture Prompt Challenge (right type, best plan, and the type pupils confuse it with) and Fix the Flashback (diagnosis, and how many pupils fixed it).</small></p><table><tr><th>Picture prompt</th><th>Answers</th><th>Right type</th><th>Best plan</th><th>Common mix-up</th></tr>${ch}</table><table><tr><th>Flawed flashback</th><th>Diagnosed</th><th>Tried the fix</th><th>Fixed</th><th>Avg attempts</th></tr>${rp}</table></div>`}
function qc(c){let a=[];try{a=JSON.parse(c||'[]')}catch(e){}if(a.length&&Array.isArray(a[0])){const L=x=>S.checkLabels[x[0]]||x[0],bad=a.filter(x=>!x[1]).map(L),ai=a.filter(x=>x[2]).map(L);return `Quick check: ${a.length-bad.length}/${a.length}`+(bad.length?' · missed: '+esc(bad.join('; ')):'')+(ai.length?' · 🤖 AI-confirmed: '+esc(ai.join('; ')):'')}return a.length?'Self-checked '+a.length+' items':''}
const PN={workers:'Workers AI',grok:'Grok',gemini:'Gemini'},OC={met:'✅ AI agreed',not_met:'❌ AI disagreed',unclear:'❓ Unclear',unavailable:'⚠️ AI unavailable'};
function aiCards(){const a=S.ai,rows=S.aiChecks.filter(x=>!F||(F==='none'?x.class_id==null:String(x.class_id)===F));
const ctl=ROLE==='admin'?`<label class="chk"><input type="checkbox" id="aie" ${a.enabled?'checked':''}><span>Turn on the AI helper for pupils</span></label><label>AI checks per pupil per day<input id="aid" type="number" min="1" max="20" value="${a.daily}"></label><button class="go sm" onclick="aiSave()">Save AI settings</button>`:`<p>${a.enabled?'The AI helper is <b>on</b>.':'The AI helper is <b>off</b> (set by the super admin).'}</p>`;
return `<div class="card"><h2>🤖 AI helper (limited)</h2><p><small>Pupils can only ask the AI about a rule the quick check marked as missing (not “had” or length), for the part of their writing that rule reads. Pupil panel: Workers AI, Grok and Gemini vote. Teacher re-attempt: Workers AI and Grok. Only the relevant text is sent (no names). Keep it off until your school has approved sending pupil text to these providers.</small></p><ul>${Object.keys(PN).map(k=>`<li>${PN[k]}: ${a.providers[k]?'✅ set up':'⚪ not set up'}</li>`).join('')}</ul>${ctl}</div>
<div class="card"><h2>🤖 AI checks pupils asked for</h2><table><tr><th>Pupil</th><th>Story</th><th>Rule</th><th>Result</th><th>Votes</th><th>Re-checks</th><th></th></tr>${rows.map(x=>{let v=[],s={};try{v=JSON.parse(x.verdicts);s=JSON.parse(x.snippet)}catch(e){}return `<tr><td>${esc(x.username)}</td><td>${esc(title(x.story))}</td><td>${esc(S.checkLabels[x.rule]||x.rule)}<details><summary>text</summary>${esc(Object.values(s).join(' … '))}</details></td><td>${OC[x.outcome]||esc(x.outcome)}<br><small>${esc(x.reason)}</small></td><td>${v.map(y=>PN[y.p]+' '+(y.met===true?'✅':y.met===false?'❌':'—')).join('<br>')}</td><td>${x.reattempts}${x.source==='teacher'?' (teacher)':''}</td><td><button class="alt sm" onclick="aiRe(${x.id})">Reattempt AI check</button></td></tr>`}).join('')||'<tr><td colspan="7">No AI checks yet.</td></tr>'}</table></div>`}
const aiSave=()=>done(()=>api('ai-settings',{enabled:$('aie').checked,daily:+$('aid').value}));
const aiRe=id=>done(()=>api('ai-reattempt',{id}));
function gaps(W){const g={};W.forEach(w=>{let a=[];try{a=JSON.parse(w.checks||'[]')}catch(e){}a.forEach(x=>{if(Array.isArray(x)){const o=g[x[0]]=g[x[0]]||[0,0];o[0]++;if(!x[1])o[1]++}})});
const rows=Object.entries(g).sort((a,b)=>b[1][1]/b[1][0]-a[1][1]/a[1][0]);return `<div class="card"><h2>✍️ Common gaps in pupil writing</h2><p><small>Share of submitted pieces that missed each quick-check rule. Use it to choose what to re-teach.</small></p><table><tr><th>Rule</th><th>Missed</th><th>Pieces</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(S.checkLabels[k]||k)}</td><td>${Math.round(100*v[1]/v[0])}%</td><td>${v[0]}</td></tr>`).join('')||'<tr><td colspan="3">No writing yet.</td></tr>'}</table></div>`}
function cell(n,g){if(n<3)return '<td style="text-align:center;opacity:.5">new</td>';const v=Math.round(100*g/n);return `<td style="text-align:center;background:${v>=85?'var(--g)':v>=60?'var(--o)':'var(--b)'}">${v}%</td>`}
function heat(P){const K=Object.keys(S.skills),G={};P.forEach(p=>{const c=N(p.class)||'(no class)',x=G[c]=G[c]||{};K.forEach(k=>{const s=p.skills[k];if(s){x[k]=x[k]||[0,0];x[k][0]+=s[0];x[k][1]+=s[1]}})});
return `<div class="card"><h2>🧭 Skill heatmap</h2><p><small>Share of first tries correct, using each pupil's last 20 first tries per skill. “new” = fewer than 3 attempts.</small></p><table><tr><th>Class</th>${K.map(k=>`<th>${S.skills[k].ic} ${esc(S.skills[k].n)}</th>`).join('')}</tr>${Object.keys(G).sort().map(c=>`<tr><td>${esc(c)}</td>${K.map(k=>cell(...(G[c][k]||[0,0]))).join('')}</tr>`).join('')||'<tr><td>No data yet.</td></tr>'}</table></div>`}
function meters(p){if(!p)return'';return `<p><b>${p.xp} XP · ${esc(p.rank)}</b></p>`+Object.keys(S.skills).map(k=>{const s=p.skills[k],v=s&&s[0]>=3?Math.round(100*s[1]/s[0]):null;return `<div class="sk"><span>${S.skills[k].ic} ${esc(S.skills[k].n)}</span><div class="xpbar"><i style="width:${v||0}%"></i></div><small>${v==null?'new':v+'%'}</small></div>`}).join('')}
const tcls=u=>done(()=>api('teacher-classes',{username:u,classIds:[...document.querySelectorAll('input[data-t]')].filter(i=>i.dataset.t===u&&i.checked).map(i=>+i.value)}),'Classes saved');
const tnew=()=>done(()=>api('teacher-create',{username:$('tn').value,password:$('tp').value}));
const tpw=u=>{const p=prompt('New password for '+u+' (8+ characters)');if(p)done(()=>api('teacher-reset',{username:u,password:p}))};
const tdel=u=>{if(confirm('Delete teacher '+u+'? Their pupils and data are not affected.'))done(()=>api('teacher-delete',{username:u}))};
const cpw=()=>done(()=>api('change-password',{old:$('op').value,password:$('np').value}),'Password changed');
login();
</script></body></html>
